[package]
name = "cross-stream"
edition = "2021"
version = "0.12.1-dev"
rust-version = "1.92.0"
description = "An event stream store for personal, local-first use, specializing in event sourcing."
license = "MIT"
repository = "https://github.com/cablehead/xs"
homepage = "https://github.com/cablehead/xs"
documentation = "https://cablehead.github.io/xs/"
readme = "README.md"
keywords = ["nu", "cli", "queue", "embedded", "eventstore"]
categories = ["command-line-utilities", "embedded", "database"]
exclude = [
    ".github/",
    ".dagger/",
    ".claude/",
    "docs/",
    "examples/",
    "notes/",
    "changes/",
    "scripts/",
    "target/",
    "tests/",
    "*.png",
    "*.gif"
]

[lib]
name = "xs"

[[bin]]
name = "xs"
path = "src/main.rs"
required-features = ["nu", "server"]

[features]
default = ["nu", "server"]
nu = [
    "dep:nu-cli",
    "dep:nu-command",
    "dep:nu-protocol",
    "dep:nu-cmd-lang",
    "dep:nu-engine",
    "dep:nu-parser",
    "dep:chrono",
    "dep:serde_urlencoded",
    "dep:url",
    "dep:tempfile",
]
server = [
    "nu",
    "dep:http",
    "dep:http-body-util",
    "dep:http-serde",
    "dep:hyper",
    "dep:hyper-util",
    "dep:iroh",
    "dep:iroh-base",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:webpki-roots",
    "dep:tokio-stream",
    "dep:tokio-util",
    "dep:url",
    "dep:console",
    "dep:chrono",
    "dep:clap",
    "dep:serde_urlencoded",
    "dep:dirs",
    "dep:rand",
    "dep:data-encoding",
    "dep:nix",
    "dep:tracing-subscriber",
]
full = ["nu", "server"]

[dependencies]
# Core dependencies (always available)
bytes = "1.6.0"
cacache = { version = "13", default-features = false, features = ["tokio-runtime", "mmap"] }
fjall = "3.0.1"
futures = "0.3.31"
scru128 = { version = "3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssri = "9.2.0"
crossbeam-channel = "0.5.13"
tracing = "0.1.40"
bon = "2.3"
tokio = { version = "1", features = ["full"] }

# Optional: used by nu and/or server
chrono = { version = "0.4.38", optional = true }
serde_urlencoded = { version = "0.7.1", optional = true }
tempfile = { version = "3.23", optional = true }

# Optional: nu
nu-cli = { version = "0.112.1", optional = true }
nu-command = { version = "0.112.1", features = ["sqlite"], optional = true }
nu-protocol = { version = "0.112.1", optional = true }
nu-cmd-lang = { version = "0.112.1", optional = true }
nu-engine = { version = "0.112.1", optional = true }
nu-parser = { version = "0.112.1", optional = true }

# Optional: server
clap = { version = "4", features = ["derive"], optional = true }
console = { version = "0.15.8", optional = true }
http = { version = "1.1.0", optional = true }
http-body-util = { version = "0.1", optional = true }
http-serde = { version = "2.1.1", optional = true }
hyper = { version = "1", features = ["full"], optional = true }
hyper-util = { version = "0.1", features = ["full"], optional = true }
tokio-stream = { version = "0.1.15", optional = true }
tokio-util = { version = "0.7.11", features = ["compat"], optional = true }
url = { version = "2.5.0", optional = true }
rustls = { version = "0.23.28", optional = true }
tokio-rustls = { version = "0.26.0", optional = true }
webpki-roots = { version = "0.26.6", optional = true }
dirs = { version = "5", optional = true }
tracing-subscriber = { version = "0.3.19", optional = true }
iroh = { version = "0.91.2", optional = true }
iroh-base = { version = "0.91.2", optional = true }
rand = { version = "0.8", optional = true }
data-encoding = { version = "2.6", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["poll", "fs"], optional = true }

[target.'cfg(windows)'.dependencies]
win_uds = { version = "=0.2.2", features = ["async"] }

[dev-dependencies]
assert_cmd = "2.0.14"
duct = "0.13.7"
static_assertions = "1.1.0"
tempfile = "3.23"
tokio-stream = "0.1.15"
tracing-subscriber = "0.3.18"
serde_urlencoded = "0.7.1"
url = "2.5.0"

[profile.release]
lto = true
codegen-units = 1

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/cross-stream-v{ version }-{ target-family }.tar.gz"
bin-dir = "cross-stream-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/cross-stream-v{ version }-linux-amd64.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/cross-stream-v{ version }-linux-amd64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/cross-stream-v{ version }-linux-arm64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/cross-stream-v{ version }-linux-arm64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/cross-stream-v{ version }-macos.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/cross-stream-v{ version }-windows-amd64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/cross-stream-v{ version }-windows-amd64.tar.gz"
